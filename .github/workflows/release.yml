name: Publier une version

# Lancé à la main depuis l'onglet Actions de GitHub : crée la release vX.Y.Z (version de Directory.Build.props)
# avec l'installeur. L'appli la propose ensuite comme mise à jour (si le dépôt est public).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Tests
        run: dotnet test OptimizingSoftware.slnx -c Release

      - name: Publier et créer l'installeur
        shell: pwsh
        run: |
          dotnet publish src/OptimizingSoftware.App -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o publish
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVersion=$version" "/DPublishDir=..\publish" installer\OptimizingSoftware.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Créer la release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create "v$env:VERSION" (Get-ChildItem installer-output\*.exe).FullName --title "Optimizing Software $env:VERSION" --generate-notes --target $env:GITHUB_SHA
